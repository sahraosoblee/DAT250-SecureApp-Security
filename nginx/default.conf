map "$request_method:$uri" $login_limit_key {
    default "";
    ~^POST:/login/?$ $binary_remote_addr;
}

limit_req_zone $login_limit_key zone=login_per_ip:10m rate=15r/m;
server {
    listen 80;
    server_name _;

    return 301 https://$host:18443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location /static/ {
        alias /var/www/static/;
        autoindex on;
    }

    location / {
                limit_req zone=login_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
